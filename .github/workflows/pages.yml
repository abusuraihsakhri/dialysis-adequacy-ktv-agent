name: Publish dialysis calculator

on:
  push:
    branches: [master]
    paths:
      - index.html
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/web
          cp index.html _site/
          cp web/index.html web/calculator.js web/app.js _site/web/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live calculator files
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}/web/"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 6 "$BASE" | grep -q "Hemodialysis adequacy calculator"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 "${BASE}calculator.js" | grep -q 'function calculate'
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 "${BASE}app.js" | grep -q 'form.addEventListener'
