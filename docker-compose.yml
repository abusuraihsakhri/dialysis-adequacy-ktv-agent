services:
  dialysis-adequacy-ktv-engine:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # A persistent secret must be supplied for production audit verification.
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set a strong AUDIT_SECRET_KEY before running}
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
