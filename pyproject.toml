[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dialysis-adequacy-ktv-engine"
version = "2.0.0"
description = "KtV-Sentinel: Hemodialysis Single-Pool & Equilibrated Kt/V Adequacy Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dialysis-adequacy-ktv-engine = "dialysis_adequacy_ktv_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dialysis-adequacy-ktv-engine"
Repository = "https://github.com/abusuraihsakhri/dialysis-adequacy-ktv-engine.git"
